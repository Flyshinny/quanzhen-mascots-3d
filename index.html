<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全真道院吉祥物</title>
<meta name="description" content="全真道院五位吉祥物 3D 角色介紹：全全、真真、忠忠、瑞瑞、恕恕。">
<link rel="icon" href="assets/ruirui.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <canvas id="scene" aria-label="五位吉祥物的 3D 舞台"></canvas>

  <header class="top">
    <p class="kicker">一貫道基礎忠恕瑞周</p>
    <h1>全真道院吉祥物</h1>
    <p class="sub">取名自「基礎忠恕瑞周全真道院」・配色取自道院紅磚、琉璃瓦、綠欄杆</p>
  </header>

  <section class="card" id="card" aria-live="polite">
    <span class="badge" id="badge"></span>
    <h2 id="name"></h2>
    <p class="desc" id="desc"></p>
    <p class="quote" id="quote"></p>
    <ul class="traits" id="traits"></ul>
  </section>

  <nav class="dock" id="dock" aria-label="選擇吉祥物">
    <button class="arrow" id="prev" aria-label="上一位">‹</button>
    <div class="thumbs" id="thumbs"></div>
    <button class="arrow" id="next" aria-label="下一位">›</button>
  </nav>

  <div class="links">
    <button class="to3d play" id="openVideo" type="button">▶ 自我介紹影片</button>
    <a class="to3d" href="characters.html">3D 人物模型 →</a>
  </div>

  <dialog class="video" id="videoDlg" aria-label="吉祥物自我介紹影片">
    <button class="close" id="closeVideo" type="button" aria-label="關閉影片">×</button>
    <video id="introVideo" src="media/intro.mp4" poster="media/intro-poster.jpg" controls playsinline preload="none"></video>
  </dialog>
  <p class="hint">點選角色・拖曳旋轉・← → 切換</p>
  <div class="loader" id="loader">載入中…</div>

  <script type="module" src="main.js"></script>
  <script>
    const dlg = document.getElementById('videoDlg'), vid = document.getElementById('introVideo');
    document.getElementById('openVideo').onclick = () => { dlg.showModal(); vid.play().catch(() => {}); };
    document.getElementById('closeVideo').onclick = () => dlg.close();
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', () => vid.pause());
    dlg.addEventListener('keydown', (e) => e.stopPropagation());
  </script>
</body>
</html>
