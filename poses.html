<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吉祥物動作表情</title>
<meta name="description" content="全真道院五位吉祥物的 3D 動作與表情庫">
<link rel="icon" href="assets/quanquan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf3e7; --ink: #4a2f22; --muted: #8a6a58; --card: rgba(255, 252, 247, 0.9);
    --line: rgba(74, 47, 34, 0.12); --brick: #b5452c; --accent: #b5452c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif; color: var(--ink); overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #fffaf3 0%, var(--bg) 60%, #f6e3cf 100%);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header { position: fixed; top: 16px; left: 0; right: 0; text-align: center; pointer-events: none; }
  header p { margin: 0; letter-spacing: .3em; font-size: 12px; font-weight: 700; color: #2b8a7e; }
  header h1 { margin: 4px 0 0; font-size: 34px; font-weight: 900; color: var(--brick); letter-spacing: .08em; }
  .back { position: fixed; top: 16px; left: 16px; text-decoration: none; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; color: var(--ink); font-weight: 700; font-size: 14px; }
  .panel {
    position: fixed; left: 16px; top: 76px; bottom: 96px; width: 300px; overflow: auto;
    background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px; box-shadow: 0 18px 50px -24px rgba(74, 47, 34, .35);
  }
  .panel h2 { margin: 6px 0 8px; font-size: 14px; color: var(--muted); letter-spacing: .1em; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 small { font-weight: 500; font-size: 11px; letter-spacing: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .code { font: 12px/1.5 ui-monospace, Consolas, monospace; background: #fff; border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; color: #5d4234; word-break: break-all; }
  .dock {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px;
    box-shadow: 0 10px 30px -16px rgba(74, 47, 34, .4); max-width: calc(100vw - 32px);
  }
  .thumb { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; font: inherit; font-weight: 700; color: var(--ink); }
  .thumb img { width: 38px; height: 38px; object-fit: contain; }
  .thumb.on { background: var(--c); color: #fff; }
  .loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); font-weight: 700; color: var(--brick); transition: opacity .5s; }
  .loader.done { opacity: 0; pointer-events: none; }
  @media (max-width: 900px) {
    header h1 { font-size: 24px; }
    .panel { top: auto; bottom: 84px; left: 10px; right: 10px; width: auto; height: 38vh; }
    .thumb span { display: none; }
    .thumb { padding: 4px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
  <canvas id="scene" aria-label="吉祥物 3D 預覽"></canvas>
  <header><p>3D 動作・表情庫</p><h1 id="title">全真道院吉祥物</h1></header>
  <a class="back" href="characters.html">← 3D 人物</a>
  <aside class="panel">
    <h2>動作 <small>循環播放</small></h2><div class="chips" id="actions"></div>
    <h2>姿勢 <small>定格</small></h2><div class="chips" id="poses"></div>
    <h2>表情 <small>可和動作搭配</small></h2><div class="chips" id="exprs"></div>
    <h2>程式用法</h2><div class="code" id="code"></div>
  </aside>
  <nav class="dock" id="dock" aria-label="選擇吉祥物"></nav>
  <div class="loader" id="loader">載入中…</div>
  <script type="module" src="poses-studio.js"></script>
</body>
</html>
